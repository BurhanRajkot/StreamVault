# Linux packages for StreamVault: npm run linux:build (CI: .github/workflows/app-release.yml)
appId: site.streamvault.app
productName: StreamVault
copyright: Copyright © 2026 StreamVault
directories:
  output: release
  buildResources: resources
files:
  - dist/**
  - electron/**
  - package.json
  # The Android bridge has no place on the desktop
  - "!node_modules/@capacitor/**"
asar: true
# ffmpeg for Premium's audio conversion (electron/rdStream.cjs): a separate
# program, GPL-3.0 — its licence and readme go with it. Fetched by
# ffmpeg-static's install script (npm ci in CI); missing locally, the app
# falls back to the system's ffmpeg.
extraResources:
  - from: node_modules/ffmpeg-static
    to: ffmpeg
    filter:
      - ffmpeg
      - ffmpeg.LICENSE
      - ffmpeg.README
linux:
  target:
    - AppImage
    - pacman
    - deb
  category: AudioVideo
  icon: resources/icon.png
  executableName: streamvault
  artifactName: StreamVault-${version}.${ext}
  synopsis: Movies, TV shows, anime and documentaries
  description: The StreamVault app — browse, stream, keep your list and continue watching, download for offline viewing.
  maintainer: Piracy Is Not Stealing <183266853+dragon-manner@users.noreply.github.com>
  desktop:
    entry:
      Name: StreamVault
      Comment: Movies, TV shows, anime and documentaries
      StartupWMClass: StreamVault
      Keywords: movies;tv;anime;streaming;
publish: null
