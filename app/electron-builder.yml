# Desktop packages for StreamVault: npm run linux:build / windows:build (CI: .github/workflows/app-release.yml)
appId: site.streamvault.app
productName: StreamVault
copyright: Copyright © 2026 StreamVault
directories:
  output: release
  buildResources: resources
files:
  - dist/**
  - electron/**
  - package.json
  # The Android bridge has no place on the desktop
  - "!node_modules/@capacitor/**"
asar: true
# ffmpeg for Premium's audio conversion (electron/rdStream.cjs): a separate
# program, GPL-3.0 — its licence and readme go with it. Fetched by
# ffmpeg-static's install script (npm ci in CI); missing locally, the app
# falls back to the system's ffmpeg.
extraResources:
  - from: node_modules/ffmpeg-static
    to: ffmpeg
    filter:
      - ffmpeg
      - ffmpeg.exe
      - ffmpeg.LICENSE
      - ffmpeg.README
linux:
  target:
    - AppImage
    - pacman
    - deb
  category: AudioVideo
  icon: resources/icon.png
  executableName: streamvault
  artifactName: StreamVault-${version}.${ext}
  synopsis: Movies, TV shows, anime and documentaries
  description: The StreamVault app — browse, stream, keep your list and continue watching, download for offline viewing.
  maintainer: Piracy Is Not Stealing <183266853+dragon-manner@users.noreply.github.com>
  desktop:
    entry:
      Name: StreamVault
      Comment: Movies, TV shows, anime and documentaries
      StartupWMClass: StreamVault
      Keywords: movies;tv;anime;streaming;
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
  artifactName: StreamVault-Setup-${version}.${ext}
  # Not code-signed: SmartScreen warns once ("Windows protected your PC" →
  # More info → Run anyway) — the README says so.
nsis:
  # One click, for this user only (no admin prompt) — which is also what lets
  # the app run the next installer silently to update itself (main.cjs)
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: StreamVault
  # Uninstalling keeps sign-in, My List and downloads' records
  deleteAppDataOnUninstall: false
publish: null
