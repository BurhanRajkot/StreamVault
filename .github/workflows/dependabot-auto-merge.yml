# StreamVault — Dependabot Auto-Merge
# Dependabot opens weekly PRs (npm, bun, docker, github-actions — see
# dependabot.yml). This merges the minor/patch ones on its own, but only
# AFTER the full CI run on the PR has passed, and only the exact commit CI
# tested. Major bumps, and anything Dependabot doesn't label with an update
# type, are left for a person.
#
# Why it runs on `workflow_run` and merges directly, instead of asking GitHub
# for native auto-merge on `pull_request` (what it did until 2026-11-15):
# `main` has no required status checks, so `gh pr merge --auto` had nothing
# to wait for. It either merged the PR ~20 seconds after it was opened —
# minutes before CI finished, so #308 landed on main with a red E2E run — or
# failed outright with "Protected branch rules not configured", which is the
# failure email this workflow used to send. Waiting for CI here needs no repo
# setting.
#
# Safe on `workflow_run` (which runs with a write token): it never checks out
# or runs PR code, and everything read from the event is passed through
# environment variables rather than interpolated into the script.

name: "Dependabot Auto-Merge"

on:
  workflow_run:  # zizmor: ignore[dangerous-triggers] — never runs PR code; see above
    workflows: ["StreamVault CI/CD"]
    types: [completed]

permissions: {}

concurrency:
  group: dependabot-auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  auto-merge:
    name: "Merge after CI (minor/patch)"
    # Only a green CI run on a pull request that Dependabot itself triggered.
    # If a person pushes to the branch, the next run's actor is that person
    # and this job doesn't touch the PR.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Merge the pull request this CI run validated
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          note() { echo "::notice title=Dependabot auto-merge::$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }

          pr=$(gh pr list --head "$HEAD_BRANCH" --state open --limit 1 \
            --json number,author,headRefOid,isDraft --jq '.[0] // empty')
          if [ -z "$pr" ]; then
            note "No open pull request for $HEAD_BRANCH — nothing to merge."
            exit 0
          fi

          number=$(jq -r '.number' <<<"$pr")
          author=$(jq -r '.author.login' <<<"$pr")
          head=$(jq -r '.headRefOid' <<<"$pr")
          draft=$(jq -r '.isDraft' <<<"$pr")

          if [ "$author" != "app/dependabot" ] || [ "$draft" = "true" ]; then
            note "#$number is not an open, ready Dependabot pull request — left alone."
            exit 0
          fi
          if [ "$head" != "$HEAD_SHA" ]; then
            note "#$number has moved on since this CI run (now $head) — its own run will decide."
            exit 0
          fi

          # Dependabot records each bump's size in its commit message
          # (`update-type: version-update:semver-minor`), one line per package.
          types=$(gh pr view "$number" --json commits --jq '.commits[].messageBody' \
            | grep -oE 'update-type: version-update:semver-(major|minor|patch)' | sort -u || true)

          if [ -z "$types" ]; then
            note "#$number doesn't say how big its update is — left for manual review."
            exit 0
          fi
          if grep -q 'semver-major' <<<"$types"; then
            note "#$number includes a major version bump — left for manual review."
            exit 0
          fi

          gh pr merge "$number" --squash --match-head-commit "$HEAD_SHA"
          note "Merged #$number: minor/patch update, CI green on $HEAD_SHA."
