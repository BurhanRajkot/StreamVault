name: "App Release (Android + Linux)"

# Builds the StreamVault app (app/) for Android (signed APK) and Linux
# (AppImage, .deb, pacman) and publishes them as a GitHub Release tagged
# app-v<version>. The installed apps check these releases and offer the update.
#
# Runs on every push to main that changes the app or the site code it's built
# from, so the app never falls behind the website. Version: major.minor from
# app/package.json, patch = this workflow's run number (1.0.<run>).

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "package-lock.json"
      - ".github/workflows/app-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-release
  cancel-in-progress: false

env:
  NODE_VERSION: "24"

jobs:
  version:
    name: "Version"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - id: v
        run: |
          base=$(node -p "require('./app/package.json').version.split('.').slice(0,2).join('.')")
          echo "version=${base}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  android:
    name: "Android APK"
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install (site deps the app is built from, then the app's own)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix app --ignore-scripts --no-audit --no-fund
      - name: Build web bundle and sync it into the Android project
        working-directory: app
        run: |
          npm run build
          npx cap sync android
      - name: Release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — releases must be signed with the same key so updates install. See app/README.md."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed APK
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out/StreamVault-${APP_VERSION}.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: out/*.apk
          if-no-files-found: error

  linux:
    name: "Linux packages"
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - name: Packaging tools (bsdtar for the pacman package)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libarchive-tools
      - name: Install
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix app --no-audit --no-fund
      - name: Build and package
        working-directory: app
        run: |
          npm run build
          npx electron-builder --linux AppImage deb pacman --publish never -c.extraMetadata.version="$APP_VERSION"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp release/*.AppImage release/*.deb release/*.pacman "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: out/*
          if-no-files-found: error

  release:
    name: "Publish release"
    needs: [version, android, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 50
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist-release
          merge-multiple: true
      - name: Stable names for the README's "latest" links
        run: |
          cd dist-release
          cp "StreamVault-${APP_VERSION}.apk" StreamVault.apk
          cp StreamVault-*.AppImage StreamVault.AppImage
          ls -la
      - name: Create the release
        run: |
          {
            echo "StreamVault ${APP_VERSION} for Android and Linux."
            echo
            echo "**Android:** download \`StreamVault-${APP_VERSION}.apk\` and open it. The app offers future updates itself."
            echo "**Linux:** \`.AppImage\` (any distro, updates itself), \`.pacman\` (Arch/EndeavourOS: \`sudo pacman -U\`), \`.deb\` (Debian/Ubuntu)."
            echo
            echo "### Changes"
            git log --no-merges --pretty='- %s' -n 15 -- app src
          } > notes.md
          gh release create "app-v${APP_VERSION}" dist-release/* \
            --title "StreamVault ${APP_VERSION}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --latest
