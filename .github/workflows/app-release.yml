name: "App Release (Android, Linux, Windows)"

# Builds the StreamVault app (app/) for Android (signed APK), Linux
# (AppImage, .deb, pacman) and Windows (installer .exe) and publishes them as a
# GitHub Release tagged app-v<version>. The installed apps check these releases
# and offer the update.
#
# Runs on every push to main that changes the app or the site code it's built
# from, so the app never falls behind the website. Version: major.minor from
# app/package.json, patch = this workflow's run number (1.0.<run>).

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "package-lock.json"
      - ".github/workflows/app-release.yml"
  # Pull requests build both apps (no release) so a broken build shows up before merge
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"

jobs:
  version:
    name: "Version"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - id: v
        run: |
          base=$(node -p "require('./app/package.json').version.split('.').slice(0,2).join('.')")
          echo "version=${base}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  android:
    name: "Android APK"
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install (site deps the app is built from, then the app's own)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix app --ignore-scripts --no-audit --no-fund
      - name: Build web bundle and sync it into the Android project
        working-directory: app
        run: |
          npm run build
          npx cap sync android
      - name: Release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              echo "::warning::No signing key on this run — building a debug APK to check the build."
              echo "APK_TASK=assembleDebug" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — releases must be signed with the same key so updates install. See app/README.md."
            exit 1
          fi
          echo "APK_TASK=assembleRelease" >> "$GITHUB_ENV"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed APK
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Maven Central rate-limits GitHub's runners (429) when the Gradle cache
        # is cold, so dependencies come through Google's mirror of it
        # (ci-maven-mirror.init.gradle). A build that still can't download
        # them tries again; a real build error fails straight away.
        run: |
          set -o pipefail
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew "$APK_TASK" --no-daemon --console=plain --init-script ci-maven-mirror.init.gradle 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
              break
            fi
            if [ "$attempt" = 3 ] || ! grep -qE 'Could not (resolve|GET|HEAD|download)|status code (429|5[0-9][0-9])|Read timed out|Connection reset' "$RUNNER_TEMP/gradle.log"; then
              exit 1
            fi
            echo "::warning::Couldn't download the build's dependencies (attempt $attempt) — trying again in $((attempt * 45))s"
            sleep $((attempt * 45))
          done
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/*/app-*.apk "$GITHUB_WORKSPACE/out/StreamVault-${APP_VERSION}.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: out/*.apk
          if-no-files-found: error

  linux:
    name: "Linux packages"
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - name: Packaging tools (bsdtar for the pacman package)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libarchive-tools
      - name: Install
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix app --no-audit --no-fund
      - name: Build and package
        working-directory: app
        run: |
          npm run build
          npx electron-builder --linux AppImage deb pacman --publish never -c.extraMetadata.version="$APP_VERSION"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp release/*.AppImage release/*.deb release/*.pacman "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: out/*
          if-no-files-found: error

  windows:
    name: "Windows installer"
    needs: version
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - name: Install
        # The app's install scripts run: ffmpeg-static fetches ffmpeg.exe for Premium's audio conversion
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix app --no-audit --no-fund
      - name: Build and package
        working-directory: app
        run: |
          npm run build
          npx electron-builder --win nsis --x64 --publish never -c.extraMetadata.version="$APP_VERSION"
          mkdir -p ../out
          cp release/*.exe ../out/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: out/*.exe
          if-no-files-found: error

  release:
    name: "Publish release"
    if: github.event_name != 'pull_request'
    needs: [version, android, linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 50
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist-release
          merge-multiple: true
      - name: Stable names for the README's "latest" links
        run: |
          cd dist-release
          cp "StreamVault-${APP_VERSION}.apk" StreamVault.apk
          cp "StreamVault-${APP_VERSION}.AppImage" StreamVault.AppImage
          cp "StreamVault-${APP_VERSION}.deb" StreamVault.deb
          cp "StreamVault-${APP_VERSION}.pacman" StreamVault.pacman
          cp "StreamVault-Setup-${APP_VERSION}.exe" StreamVault-Setup.exe
          ls -la
      - name: Create the release
        run: |
          {
            echo "StreamVault ${APP_VERSION} for Linux, Android and Windows."
            echo
            echo "**Linux:** \`.AppImage\` (any distro, updates itself), \`.pacman\` (Arch/EndeavourOS: \`sudo pacman -U\`), \`.deb\` (Debian/Ubuntu)."
            echo "**Android:** download \`StreamVault-${APP_VERSION}.apk\` and open it. The app offers future updates itself."
            echo "**Windows:** download \`StreamVault-Setup-${APP_VERSION}.exe\` and run it (SmartScreen: More info → Run anyway). It updates itself."
            echo
            echo "### Changes"
            git log --no-merges --pretty='- %s' -n 15 -- app src
          } > notes.md
          gh release create "app-v${APP_VERSION}" dist-release/* \
            --title "StreamVault ${APP_VERSION}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --latest
      - name: Mirror to Supabase Storage (fast downloads)
        # GitHub's release CDN crawls on some ISPs; the README links and the
        # apps' update check use this mirror first (app/scripts/mirror-release.sh)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY are not set — this release is on GitHub only."
            exit 0
          fi
          bash app/scripts/mirror-release.sh dist-release "$APP_VERSION"
