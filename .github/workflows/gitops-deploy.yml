# StreamVault — GitOps Image Tag Updater
# Triggered after the main CI/CD pipeline successfully publishes images.
# Updates the Kustomize image tags in the production overlay, creating a
# commit that ArgoCD detects and syncs to the cluster.

name: "GitOps — Update Image Tags"

# Safe on `workflow_run` (which runs with a write token): it never checks out
# or runs code from the triggering run — only main as it is now — and it only
# acts on a green CI run of a *push* to this repository's main. A pull request
# from a fork whose branch happens to be called "main" also reports
# head_branch == 'main', so the branch filter alone would let a fork's commit
# be written into the production image tags; the event and repository checks
# below are what rule that out.
on:
  workflow_run:  # zizmor: ignore[dangerous-triggers] — guarded as described above
    workflows: ["StreamVault CI/CD"]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  update-manifests:
    name: "Update K8s Image Tags"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # the GitOps commit
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          fetch-depth: 1
          # The token is handed to the one push below, not left in .git/config (zizmor artipacked)
          persist-credentials: false

      - name: Resolve image tag
        id: tag
        # Fix: assign github expression to env var before shell use (zizmor #444)
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::Unexpected commit id"; exit 1; fi
          SHORT_SHA="${HEAD_SHA:0:7}"
          TAG="sha-${SHORT_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "full_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${TAG}"

      - name: Update production kustomization
        # Fix: assign step outputs to env vars before shell use (zizmor #445, #446)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          KUSTOMIZATION="infrastructure/k8s/overlays/production/kustomization.yaml"

          echo "Updating image tags to: ${TAG}"

          # Use sed to update the newTag fields for both frontend and backend.
          # The kustomization.yaml uses the 'images' transformer:
          #   images:
          #     - name: ghcr.io/dragon-manner/streamvault-frontend
          #       newTag: <value>
          #     - name: ghcr.io/dragon-manner/streamvault-backend
          #       newTag: <value>
          sed -i "s|newTag: .*# Replaced by GitOps workflow with sha-<commit>|newTag: ${TAG}  # Replaced by GitOps workflow with sha-<commit>|g" "$KUSTOMIZATION"
          sed -i "s|newTag: sha-[a-f0-9]*|newTag: ${TAG}|g" "$KUSTOMIZATION"

          echo "Updated kustomization:"
          cat "$KUSTOMIZATION"

      - name: Commit and push
        # Fix: assign step outputs to env vars before shell use (zizmor #447)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ steps.tag.outputs.full_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add infrastructure/k8s/overlays/production/kustomization.yaml

          # Only commit if there are actual changes
          if git diff --cached --quiet; then
            echo "No changes to commit — image tags already up to date."
            exit 0
          fi

          git commit -m "chore(gitops): update image tags to ${TAG}

          Source commit: ${SHA}
          Triggered by: StreamVault CI/CD workflow run
          ArgoCD will auto-sync this change to the production cluster."

          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
