# StreamVault — OpenSSF Scorecard
# Scores the repo against supply-chain best practices (branch protection,
# token permissions, pinned dependencies, dangerous workflow patterns, …)
# and publishes findings to the Security tab. Public-repo state-of-the-art.

name: "OpenSSF Scorecard"

on:
  branch_protection_rule:
  schedule:
    - cron: "27 4 * * 1"   # Weekly — Monday 04:27 UTC
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: "Scorecard analysis"
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF
      id-token: write          # publish results to the public Scorecard API
      contents: read
      actions: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@e8e61e86ea0a152be84d03729c02a7300065c17d  # main
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true   # required for the Scorecard badge

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          sarif_file: scorecard.sarif
          category: ossf-scorecard

      - name: Upload artifact (raw results)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: scorecard-results
          path: scorecard.sarif
          retention-days: 14