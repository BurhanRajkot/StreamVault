# StreamVault — Automated Dependency Update Workflow
#
# Runs npm-check-updates (ncu) against the frontend and backend package.json
# files on a weekly schedule, targeting `latest` — including major version
# bumps, e.g. a new React major. This complements Dependabot (which handles
# lockfiles and Docker images via its own PR flow) by aggressively bumping
# semver ranges in package.json itself.
#
# HANDS-OFF BY DESIGN: after bumping, each area's job runs the same
# type-check/lint/build/test steps its normal CI job runs, using the updated
# dependencies. The result is then landed as an auto-merging pull request:
# the workflow opens a PR (never pushes to `main` directly) and enables
# GitHub's native auto-merge, so the change merges on its own once the
# required checks are green — no manual click for the happy path.
#
# WHY A PR AND NOT A DIRECT PUSH (this is the important bit):
#   GitHub deliberately does NOT re-trigger workflows for pushes or PRs made
#   with the built-in GITHUB_TOKEN — it's the anti-recursion rule. The old
#   version of this workflow pushed straight to `main` with GITHUB_TOKEN,
#   which meant the full ci.yml pipeline (e2e / CodeQL / Trivy / OSV) never
#   ran on the upgrade and GitOps never deployed it. Routing through a PR is
#   the fix, but only fully closes the gap when the PR is opened by a token
#   that CAN trigger workflows:
#
#     • DEPS_BOT_PAT set  → the PR triggers the FULL ci.yml, and auto-merge
#                           waits for those required checks before merging.
#                           This is the recommended, fully-gated setup.
#     • no PAT (default)  → the PR is opened with GITHUB_TOKEN, so ci.yml
#                           will NOT run on it. The in-job validation above
#                           (type-check/lint/build/test) is then the only
#                           gate, and auto-merge lands the PR once it is
#                           mergeable. Still strictly safer than the old
#                           direct-push: there's a reviewable PR and a diff.
#
#   To upgrade to full gating: create a repo/least-privilege PAT (or GitHub
#   App token) with `contents:write` + `pull-requests:write`, save it as the
#   DEPS_BOT_PAT secret. Nothing else changes.
#
# Also required once, in repo settings: Settings → General → "Allow
# auto-merge" must be enabled, otherwise the auto-merge step is a no-op
# (the workflow logs a notice and leaves the PR open for a manual merge).
#
# Schedule: Every Tuesday at 03:00 UTC (one day after Dependabot's Monday sweep,
#           so both sets of PRs don't pile up on the same day).
#
# Manual trigger: workflow_dispatch (run it any time from the Actions tab).
#
# Token / permissions:
#   - DEPS_BOT_PAT (optional) or GITHUB_TOKEN (built-in) — opens the PR and
#     enables auto-merge via the gh CLI.
#   - The workflow needs `contents: write` + `pull-requests: write`.

name: Dependency Update

on:
  schedule:
    - cron: "0 3 * * 2" # Every Tuesday 03:00 UTC
  workflow_dispatch:
    inputs:
      target:
        description: "Which packages to upgrade (always targets latest, including majors)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - frontend
          - backend

concurrency:
  group: dependency-update
  cancel-in-progress: false # Never cancel an in-flight update job

permissions:
  contents: write
  pull-requests: write

env:
  NODE_VERSION: "24"
  BUN_VERSION: "1.3.14" # Latest stable. 1.4.0 does not exist and caused 404 errors.

jobs:
  # ──────────────────────────────────────────────────────────────
  #  UPDATE FRONTEND DEPS (root package.json)
  # ──────────────────────────────────────────────────────────────
  update-frontend:
    name: "Bump & Validate Frontend Dependencies"
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' && (
        inputs.target == 'all' ||
        inputs.target == 'frontend'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_MOCK_AUTH: "true"
      VITE_API_URL: "http://localhost:4173"
    outputs:
      changed: ${{ steps.ncu.outputs.changed }}
      summary: ${{ steps.ncu.outputs.summary }}
      validated: ${{ steps.validate.outputs.validated }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # DEPS_BOT_PAT if present (so the PR opened in land-changes triggers
          # the full ci.yml), else the built-in token. See the header comment
          # for the trade-off.
          token: ${{ secrets.DEPS_BOT_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install npm-check-updates
        run: npm install -g npm-check-updates@latest --no-fund --no-audit

      - name: Run ncu — frontend (target latest, majors included)
        id: ncu
        run: |
          echo "Running ncu with target=latest on root package.json"

          # Run ncu and capture output; --jsonUpgraded prints a JSON diff
          UPGRADED=$(ncu \
            --upgrade \
            --target latest \
            --jsonUpgraded \
            --reject "caniuse-lite" \
            2>/dev/null || echo "{}")

          echo "ncu output: ${UPGRADED}"

          # Check if anything actually changed
          if [ "$UPGRADED" = "{}" ] || [ -z "$UPGRADED" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "summary=No frontend packages need upgrading." >> "$GITHUB_OUTPUT"
          else
            COUNT=$(echo "$UPGRADED" | node -e \
              "const d=require('fs').readFileSync('/dev/stdin','utf8'); \
               console.log(Object.keys(JSON.parse(d)).length)")
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "summary=Frontend: ${COUNT} package(s) upgraded." >> "$GITHUB_OUTPUT"
          fi

      - name: Reinstall with updated versions
        if: steps.ncu.outputs.changed == 'true'
        run: npm install --legacy-peer-deps --no-audit

      # ── Validation gate — same checks frontend-ci runs, against the
      #    upgraded dependencies. continue-on-error so every check runs and
      #    reports, instead of the job aborting after the first failure.
      - name: Validate — type-check
        id: typecheck
        if: steps.ncu.outputs.changed == 'true'
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Validate — lint
        id: lint
        if: steps.ncu.outputs.changed == 'true'
        continue-on-error: true
        run: npm run lint

      - name: Validate — build
        id: build
        if: steps.ncu.outputs.changed == 'true'
        continue-on-error: true
        run: npm run build

      - name: Validate — test
        id: test
        if: steps.ncu.outputs.changed == 'true'
        continue-on-error: true
        run: npm run test --if-present

      - name: Determine validation result
        id: validate
        run: |
          if [ "${{ steps.ncu.outputs.changed }}" != "true" ]; then
            echo "validated=true" >> "$GITHUB_OUTPUT" # nothing changed — vacuously fine
            exit 0
          fi
          if [ "${{ steps.typecheck.outcome }}" = "success" ] && \
             [ "${{ steps.lint.outcome }}" = "success" ] && \
             [ "${{ steps.build.outcome }}" = "success" ] && \
             [ "${{ steps.test.outcome }}" = "success" ]; then
            echo "validated=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Dependency Update::Frontend validation failed (type-check=${{ steps.typecheck.outcome }}, lint=${{ steps.lint.outcome }}, build=${{ steps.build.outcome }}, test=${{ steps.test.outcome }}) — will open a PR instead of pushing to main."
            echo "validated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload updated frontend manifests
        if: steps.ncu.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-updated-manifests
          path: |
            package.json
            package-lock.json
          retention-days: 1

  # ──────────────────────────────────────────────────────────────
  #  UPDATE BACKEND DEPS (backend/package.json)
  # ──────────────────────────────────────────────────────────────
  update-backend:
    name: "Bump & Validate Backend Dependencies"
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' && (
        inputs.target == 'all' ||
        inputs.target == 'backend'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.ncu.outputs.changed }}
      summary: ${{ steps.ncu.outputs.summary }}
      validated: ${{ steps.validate.outputs.validated }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun ${{ env.BUN_VERSION }}
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install npm-check-updates
        run: npm install -g npm-check-updates@latest --no-fund --no-audit

      - name: Run ncu — backend (target latest, majors included)
        id: ncu
        working-directory: ./backend
        run: |
          echo "Running ncu with target=latest on backend/package.json"

          UPGRADED=$(ncu \
            --upgrade \
            --target latest \
            --jsonUpgraded \
            2>/dev/null || echo "{}")

          echo "ncu output: ${UPGRADED}"

          if [ "$UPGRADED" = "{}" ] || [ -z "$UPGRADED" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "summary=No backend packages need upgrading." >> "$GITHUB_OUTPUT"
          else
            COUNT=$(echo "$UPGRADED" | node -e \
              "const d=require('fs').readFileSync('/dev/stdin','utf8'); \
               console.log(Object.keys(JSON.parse(d)).length)")
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "summary=Backend: ${COUNT} package(s) upgraded." >> "$GITHUB_OUTPUT"
          fi

      - name: Reinstall with updated versions (bun)
        if: steps.ncu.outputs.changed == 'true'
        working-directory: ./backend
        run: bun install

      # ── Validation gate — same checks backend-ci runs, against the
      #    upgraded dependencies.
      - name: Validate — type-check
        id: typecheck
        if: steps.ncu.outputs.changed == 'true'
        continue-on-error: true
        working-directory: ./backend
        run: bunx tsc --noEmit

      - name: Validate — lint
        id: lint
        if: steps.ncu.outputs.changed == 'true'
        continue-on-error: true
        working-directory: ./backend
        run: bun run lint

      - name: Validate — build
        id: build
        if: steps.ncu.outputs.changed == 'true'
        continue-on-error: true
        working-directory: ./backend
        run: bun run build

      - name: Validate — test
        id: test
        if: steps.ncu.outputs.changed == 'true'
        continue-on-error: true
        working-directory: ./backend
        run: bun run test

      - name: Determine validation result
        id: validate
        run: |
          if [ "${{ steps.ncu.outputs.changed }}" != "true" ]; then
            echo "validated=true" >> "$GITHUB_OUTPUT" # nothing changed — vacuously fine
            exit 0
          fi
          if [ "${{ steps.typecheck.outcome }}" = "success" ] && \
             [ "${{ steps.lint.outcome }}" = "success" ] && \
             [ "${{ steps.build.outcome }}" = "success" ] && \
             [ "${{ steps.test.outcome }}" = "success" ]; then
            echo "validated=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Dependency Update::Backend validation failed (type-check=${{ steps.typecheck.outcome }}, lint=${{ steps.lint.outcome }}, build=${{ steps.build.outcome }}, test=${{ steps.test.outcome }}) — will open a PR instead of pushing to main."
            echo "validated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload updated backend manifests
        if: steps.ncu.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-updated-manifests
          path: |
            backend/package.json
            backend/bun.lock
            backend/package-lock.json
          retention-days: 1

  # ──────────────────────────────────────────────────────────────
  #  LAND CHANGES — open an auto-merging PR (never a direct push to main)
  # ──────────────────────────────────────────────────────────────
  land-changes:
    name: "Land Dependency Changes"
    needs: [update-frontend, update-backend]
    # Run only if at least one of the jobs produced changes
    if: >-
      !cancelled() && (
        needs.update-frontend.outputs.changed == 'true' ||
        needs.update-backend.outputs.changed == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # DEPS_BOT_PAT (if set) so the PR opened below triggers ci.yml and
          # auto-merge gates on those checks; otherwise the built-in token.
          token: ${{ secrets.DEPS_BOT_PAT || secrets.GITHUB_TOKEN }}

      - name: Download updated frontend manifests
        if: needs.update-frontend.outputs.changed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-updated-manifests
          path: ./ # Restore to root
        continue-on-error: true

      - name: Download updated backend manifests
        if: needs.update-backend.outputs.changed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-updated-manifests
          path: backend/
        continue-on-error: true

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Stage, commit & push branch
        id: stage
        env:
          FRONTEND_CHANGED: ${{ needs.update-frontend.outputs.changed }}
          BACKEND_CHANGED: ${{ needs.update-backend.outputs.changed }}
          FRONTEND_VALIDATED: ${{ needs.update-frontend.outputs.validated }}
          BACKEND_VALIDATED: ${{ needs.update-backend.outputs.validated }}
          FRONTEND_SUMMARY: ${{ needs.update-frontend.outputs.summary }}
          BACKEND_SUMMARY: ${{ needs.update-backend.outputs.summary }}
        run: |
          # Stage changed manifests only
          if [ "$FRONTEND_CHANGED" = "true" ]; then
            git add package.json package-lock.json || true
          fi
          if [ "$BACKEND_CHANGED" = "true" ]; then
            git add backend/package.json backend/bun.lock backend/package-lock.json || true
          fi

          if git diff --cached --quiet; then
            echo "Nothing to commit — manifests unchanged after restore."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Did every changed area pass its in-job validation? This decides
          # whether we let auto-merge land the PR or hold it for a human.
          VALIDATED=true
          if [ "$FRONTEND_CHANGED" = "true" ] && [ "$FRONTEND_VALIDATED" != "true" ]; then VALIDATED=false; fi
          if [ "$BACKEND_CHANGED" = "true" ] && [ "$BACKEND_VALIDATED" != "true" ]; then VALIDATED=false; fi
          echo "validated=${VALIDATED}" >> "$GITHUB_OUTPUT"

          # One branch per day: a manual re-run on the same day updates the
          # existing PR instead of piling up new ones.
          BRANCH="chore/dep-update-$(date +'%Y-%m-%d')"
          git checkout -B "${BRANCH}"
          git commit -m "chore(deps): automated dependency update $(date +'%Y-%m-%d')

          $([ "$FRONTEND_CHANGED" = "true" ] && echo "$FRONTEND_SUMMARY")
          $([ "$BACKEND_CHANGED" = "true" ] && echo "$BACKEND_SUMMARY")

          Automated by: .github/workflows/dependency-update.yml"
          # Force-push is safe: this is a throwaway bot branch we fully own.
          git push --force origin "${BRANCH}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Open PR & enable auto-merge
        if: steps.stage.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.DEPS_BOT_PAT || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.stage.outputs.branch }}
          VALIDATED: ${{ steps.stage.outputs.validated }}
          HAS_PAT: ${{ secrets.DEPS_BOT_PAT != '' }}
          FRONTEND_SUMMARY: ${{ needs.update-frontend.outputs.summary }}
          BACKEND_SUMMARY: ${{ needs.update-backend.outputs.summary }}
          FRONTEND_CHANGED: ${{ needs.update-frontend.outputs.changed }}
          BACKEND_CHANGED: ${{ needs.update-backend.outputs.changed }}
        run: |
          DATE=$(date +'%Y-%m-%d')

          if [ "$VALIDATED" = "true" ]; then
            GATE_LINE="✅ **In-job validation passed** (type-check / lint / build / test against the upgraded deps). Auto-merge is enabled."
          else
            GATE_LINE="⚠️ **In-job validation FAILED** (type-check / lint / build / test). Auto-merge is intentionally **not** enabled — review before merging."
          fi

          if [ "$HAS_PAT" = "true" ]; then
            CI_LINE="This PR was opened with a bot PAT, so the **full ci.yml** (e2e / CodeQL / Trivy / OSV) runs on it and auto-merge waits for those required checks."
          else
            CI_LINE="⚠️ Opened with the built-in \`GITHUB_TOKEN\`, so **ci.yml does not run on this PR** (GitHub's anti-recursion rule). The in-job validation above is the only gate. Add a \`DEPS_BOT_PAT\` secret to enable full-CI gating — see the workflow header."
          fi

          BODY="## Automated Dependency Update — ${DATE}

          Opened automatically by the \`dependency-update\` workflow. Targets are bumped to **latest**, including majors.

          ${GATE_LINE}

          ${CI_LINE}

          ### Changes"

          if [ "$FRONTEND_CHANGED" = "true" ]; then
            BODY="${BODY}
          - 🎨 **Frontend**: ${FRONTEND_SUMMARY}"
          fi
          if [ "$BACKEND_CHANGED" = "true" ]; then
            BODY="${BODY}
          - ⚙️ **Backend**: ${BACKEND_SUMMARY}"
          fi

          BODY="${BODY}

          > _If something breaks, close this PR and investigate; the next run reopens a fresh one._"

          # Reuse the PR for today's branch if it already exists, else create it.
          PR_URL=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --title "chore(deps): automated dependency update ${DATE}" \
              --body  "${BODY}" \
              --base  main \
              --head  "${BRANCH}" \
              --label "dependencies,automated" 2>/dev/null) \
              || PR_URL=$(gh pr create \
                   --title "chore(deps): automated dependency update ${DATE}" \
                   --body "${BODY}" --base main --head "${BRANCH}")
          else
            echo "Reusing existing PR ${PR_URL}."
            gh pr edit "$PR_URL" --body "${BODY}" || true
          fi
          echo "PR: ${PR_URL}"

          # Enable auto-merge only for validated upgrades. Requires "Allow
          # auto-merge" in repo settings; if it's off, gh errors and we just
          # leave the PR open for a manual merge.
          if [ "$VALIDATED" = "true" ]; then
            gh pr merge --auto --squash "$PR_URL" \
              || echo "::notice title=Dependency Update::Could not enable auto-merge — enable Settings → General → 'Allow auto-merge'. PR left open for manual merge."
          else
            gh pr comment "$PR_URL" --body "Auto-merge was **not** enabled because the in-job validation failed. Please review." || true
          fi

  # ──────────────────────────────────────────────────────────────
  #  REPORT — summary even when nothing changed
  # ──────────────────────────────────────────────────────────────
  report:
    name: "Update Summary"
    needs: [update-frontend, update-backend, land-changes]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print summary
        env:
          FRONTEND_CHANGED: ${{ needs.update-frontend.outputs.changed }}
          FRONTEND_SUMMARY: ${{ needs.update-frontend.outputs.summary }}
          FRONTEND_VALIDATED: ${{ needs.update-frontend.outputs.validated }}
          BACKEND_CHANGED: ${{ needs.update-backend.outputs.changed }}
          BACKEND_SUMMARY: ${{ needs.update-backend.outputs.summary }}
          BACKEND_VALIDATED: ${{ needs.update-backend.outputs.validated }}
          LAND_RESULT: ${{ needs.land-changes.result }}
        run: |
          echo "## StreamVault Dependency Update Report"
          echo ""
          echo "| Area     | Changed | Validated | Summary |"
          echo "|----------|---------|-----------|---------|"
          echo "| Frontend | ${FRONTEND_CHANGED:-false} | ${FRONTEND_VALIDATED:-n/a} | ${FRONTEND_SUMMARY:-no changes} |"
          echo "| Backend  | ${BACKEND_CHANGED:-false}  | ${BACKEND_VALIDATED:-n/a}  | ${BACKEND_SUMMARY:-no changes}  |"
          echo ""
          if [ "$LAND_RESULT" = "success" ]; then
            echo "✅ Update PR opened — see the Pull Requests tab. It auto-merges once its checks are green (validated upgrades only)."
          elif [ "$LAND_RESULT" = "skipped" ]; then
            echo "✅ No packages to upgrade this week — all up to date."
          else
            echo "⚠️  land-changes job result: ${LAND_RESULT}"
          fi
